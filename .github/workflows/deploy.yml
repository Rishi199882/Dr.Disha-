name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Static Applet
        run: |
          npm run build
          touch dist/.nojekyll
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME; fi
          if [ -f public/404.html ]; then cp public/404.html dist/404.html; fi

      # Method 1: Zero-configuration branch deployment (Pushes build to gh-pages branch)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Method 2: Direct GitHub Actions Pages Deployment (If Pages source is set to GitHub Actions)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
